<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Super Admin</title>
<style>body{font-family:system-ui,sans-serif;background:#060d17;margin:0;padding:14px;color:#222}.w{max-width:860px;margin:auto}h1,h2{color:#d4af37}
.c{background:#fdfbf7;border-radius:10px;padding:12px;margin-bottom:10px}input{padding:9px;border:1px solid #ccc;border-radius:6px;font-size:16px;width:100%;box-sizing:border-box;margin-bottom:6px}
button{padding:7px 10px;border:0;border-radius:6px;font-size:14px;margin:2px;background:#ddd}.p{background:#00348a;color:#fff}.d{background:#c0392b;color:#fff}.h{display:none}
.u{border-bottom:1px solid #ddd;padding:8px 0}.b{font-size:12px;padding:2px 6px;border-radius:8px;background:#f3e5ab}.a{font-size:13px;padding:3px 0;border-bottom:1px solid #eee}</style></head>
<body><div class="w"><h1>Super Admin</h1>
<div id="lg" class="c"><input id="e" type="email" placeholder="Super user email"><input id="p" type="password" placeholder="Password"><button class="p" onclick="login()">Log in</button><div id="er" style="color:#c0392b"></div></div>
<div id="main" class="h"><div class="c" id="bill"></div><h2>Admin users</h2><div class="c" id="us"></div><h2>Recent activity</h2><div class="c" id="ac"></div></div></div>
<script>
let tok="";try{tok=localStorage.getItem("tok")||""}catch(e){}
const $=i=>document.getElementById(i),D=t=>t?new Date(t).toLocaleString():"never",esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
async function login(){const r=await fetch("/api/auth",{method:"POST",body:JSON.stringify({action:"login",email:$("e").value,password:$("p").value})});
 const d=await r.json();if(!r.ok){$("er").textContent=d.error;return}tok=d.token;try{localStorage.setItem("tok",tok)}catch(e){}load()}
async function load(){if(!tok)return;const r=await fetch("/api/super",{headers:{"x-session":tok}});
 if(r.status==403){$("er").textContent="This account is not the super user.";return}if(!r.ok)return;
 const d=await r.json();$("lg").classList.add("h");$("main").classList.remove("h");
 $("bill").innerHTML=`Subscription: <b>${d.billing.access?"active / on trial":"EXPIRED"}</b><br>Trial ends: ${D(d.billing.trialEndsAt)}<br>Paid until: ${D(d.billing.paidUntil)}`;
 $("us").innerHTML=d.users.map(u=>`<div class="u"><b>${esc(u.email)}</b> ${u.super?'<span class="b">super</span>':""} ${u.disabled?'<span class="b" style="background:#f5b7b1">disabled</span>':""}<br><small>Created ${D(u.created)} · Last login ${D(u.lastLogin)}</small><br>
 ${u.super?`<button onclick="act('logout','${esc(u.email)}')">Force logout</button>`:`<button onclick="act('${u.disabled?"enable":"disable"}','${esc(u.email)}')">${u.disabled?"Enable":"Disable"}</button><button onclick="act('logout','${esc(u.email)}')">Force logout</button><button onclick="rp('${esc(u.email)}')">Reset password</button><button class="d" onclick="del('${esc(u.email)}')">Delete</button>`}</div>`).join("");
 $("ac").innerHTML=d.activity.map(a=>`<div class="a">${D(a.t)} — <b>${esc(a.event)}</b> ${esc(a.email)} ${esc(a.detail||"")}</div>`).join("")||"No activity yet."}
async function act(action,email,newPassword){const r=await fetch("/api/super",{method:"POST",headers:{"x-session":tok},body:JSON.stringify({action,email,newPassword})});
 const d=await r.json();if(!r.ok)alert(d.error);load()}
function rp(e){const n=prompt("New password for "+e+" (8+ characters):");if(n)act("resetpw",e,n)}
function del(e){if(confirm("Delete "+e+"? This frees their slot."))act("delete",e)}
load();
</script></body></html>
