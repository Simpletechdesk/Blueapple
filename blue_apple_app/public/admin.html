<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Blueapple</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
<style>
body{font-family:system-ui,sans-serif;background:#0b192c;margin:0;padding:14px;color:#222}.w{max-width:780px;margin:auto}h1{color:#d4af37;font-size:22px}
.c{background:#fdfbf7;border-radius:10px;padding:12px;margin-bottom:10px}input,select,textarea{padding:9px;border:1px solid #ccc;border-radius:6px;font-size:16px;width:100%;box-sizing:border-box;font-family:inherit}
.r{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}.r3{grid-template-columns:2fr 1fr}button{padding:10px 14px;border:0;border-radius:6px;font-size:15px;margin:2px 0}
.p{background:#00348a;color:#fff}.d{background:#c0392b;color:#fff}.l{background:#ddd}.h{display:none}#bar{position:sticky;top:0;background:#0b192c;padding:8px 0;z-index:5}
#st{color:#f3e5ab;font-weight:600;margin:6px 0}.bn{background:#f3e5ab;padding:10px;border-radius:8px;margin-bottom:10px}
 html.intro-lock, html.intro-lock body { overflow: hidden; }
        #pageIntro { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; pointer-events: auto; cursor: pointer; }
        #pageIntro .intro-panel { position: absolute; left: 0; right: 0; height: 50.5%; background: radial-gradient(ellipse at 50% 100%, rgba(0, 168, 232, 0.16) 0%, transparent 60%), #060d17; transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1); }
        #pageIntro .intro-panel.top { top: 0; }
        #pageIntro .intro-panel.bottom { bottom: 0; background: radial-gradient(ellipse at 50% 0%, rgba(0, 52, 138, 0.3) 0%, transparent 60%), #060d17; }
        #pageIntro .intro-seam { position: absolute; top: 50%; left: 50%; height: 1px; width: 0; transform: translate(-50%, -50%); background: linear-gradient(90deg, transparent, #d4af37 20%, #fcf6ba 50%, #d4af37 80%, transparent); box-shadow: 0 0 18px rgba(212, 175, 55, 0.7); opacity: 0; }
        #pageIntro .intro-content { position: relative; z-index: 2; text-align: center; display: flex; flex-direction: column; align-items: center; transition: opacity 0.5s ease, transform 0.9s cubic-bezier(0.77, 0, 0.175, 1), filter 0.6s ease; }
        #pageIntro .intro-mark { display: flex; align-items: baseline; gap: 0.35em; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: clamp(3rem, 10vw, 6rem); letter-spacing: -0.03em; line-height: 1; }
        #pageIntro .intro-word { display: inline-flex; overflow: hidden; padding: 0.6em 0.02em 0.08em; margin-top: -0.35em; }
        #pageIntro .intro-letter { display: inline-block; opacity: 0; transform: translateY(110%); animation: introLetterUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        #pageIntro .intro-blue .intro-letter { color: #00a8e8; text-shadow: 0 0 28px rgba(0, 168, 232, 0.55); }
        #pageIntro .intro-apple .intro-letter { color: #1f5fd1; text-shadow: 0 0 28px rgba(0, 52, 138, 0.8); }
        #pageIntro .intro-a { position: relative; }
        #pageIntro .intro-leaf { position: absolute; top: -0.32em; left: 50%; width: 0.32em; height: 0.32em; color: #d4af37; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.8)); opacity: 0; transform: translate(-50%, -60%) rotate(-40deg) scale(0.4); animation: introLeaf 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 1.05s forwards; }
        #pageIntro .intro-sub { margin-top: 1.1rem; padding: 0.4rem 0; font-family: 'Cinzel', serif; font-weight: 700; text-transform: uppercase; font-size: clamp(0.75rem, 2vw, 1rem); color: #f3e5ab; border-top: 1px solid rgba(212, 175, 55, 0.5); border-bottom: 1px solid rgba(212, 175, 55, 0.5); letter-spacing: 0.1em; opacity: 0; animation: introTrack 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.15s forwards; }
        #pageIntro .intro-tag { margin-top: 0.8rem; font-family: 'Playfair Display', serif; font-style: italic; font-size: clamp(0.8rem, 1.8vw, 0.95rem); color: rgba(243, 229, 171, 0.75); opacity: 0; animation: introFade 0.8s ease 1.6s forwards; }
        @keyframes introLetterUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes introLeaf { to { opacity: 1; transform: translate(-50%, -60%) rotate(0deg) scale(1); } }
        @keyframes introTrack { from { opacity: 0; letter-spacing: 0.1em; } to { opacity: 1; letter-spacing: 0.45em; padding-left: 1.2em; padding-right: 0.8em; } }
        @keyframes introFade { to { opacity: 1; } }
        #pageIntro.intro-exit { pointer-events: none; }
        #pageIntro.intro-exit .intro-content { opacity: 0; transform: scale(1.12); filter: blur(6px); }
        #pageIntro.intro-exit .intro-seam { animation: introSeam 1.1s cubic-bezier(0.77, 0, 0.175, 1) forwards; }
        #pageIntro.intro-exit .intro-panel { transition-delay: 0.35s; }
        #pageIntro.intro-exit .intro-panel.top { transform: translateY(-100%); }
        #pageIntro.intro-exit .intro-panel.bottom { transform: translateY(100%); }
        @keyframes introSeam { 0% { width: 0; opacity: 0; } 35% { width: 100%; opacity: 1; } 100% { width: 100%; opacity: 0; } }
    
</style>
</head>
<body><div class="w"><h1>""</h1>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- PAGE INTRO SPLASH -->

  <!--<div id="login" class="c"><h3 id="lt" style="margin:0 0 8px">Admin login</h3>
<input id="em0" type="email" placeholder="Email" style="margin-bottom:6px"><input type="password" id="pw" placeholder="Password" style="margin-bottom:6px">
<input id="code" placeholder="Invite code (the owner's setup code)" class="h" style="margin-bottom:6px">
<button class="p" id="go" onclick="login()">Log in</button> <button class="l" id="sw" onclick="toggle()">Create account</button>
<div id="slots" style="font-size:13px;margin-top:6px"></div><div id="le" style="color:#c0392b"></div></div>
<div id="ed" class="h"><div id="bn" class="bn"></div>
  -->
<!--<div id="bar"><input id="q" placeholder="Search items..." oninput="render()"><div id="st"></div><button class="l" onclick="add()">+ Add item</button> <button class="p" onclick="save()">Save changes</button></div>
<div id="list"></div></div></div>
<datalist id="subs"></datalist> -->
<script>
let menu=[],tok="",info={},mode="login";
const $=i=>document.getElementById(i);
fetch("/api/auth").then(r=>r.json()).then(d=>{$("slots").textContent=d.users+" of "+d.max+" admin accounts created";if(d.full)$("sw").classList.add("h")});
try{tok=localStorage.getItem("tok")||""}catch(e){}
function toggle(){mode=mode=="login"?"register":"login";const r=mode=="register";$("code").classList.toggle("h",!r);$("lt").textContent=r?"Create admin account":"Admin login";$("go").textContent=r?"Create account":"Log in";$("sw").textContent=r?"Back to login":"Create account"}
async function login(){$("le").textContent="";
 const a=await fetch("/api/auth",{method:"POST",body:JSON.stringify({action:mode,email:$("em0").value,password:$("pw").value,code:$("code").value})});
 const d=await a.json();if(!a.ok){$("le").textContent=d.error;return}
 tok=d.token;try{localStorage.setItem("tok",tok)}catch(e){}
 await enter()}
async function enter(){
 const r=await fetch("/api/menu",{method:"POST",headers:{"x-session":tok}});
 if(!r.ok)return;
 info=await r.json();
 let m=await (await fetch("/api/menu")).json();
 if(!m.length)m=await (await fetch("/api/menu?defaults=1")).json();
 menu=m;$("login").classList.add("h");$("ed").classList.remove("h");banner();render()}
if(tok)enter();
function banner(){const d=t=>new Date(t).toLocaleDateString();
 let h=info.paidUntil>Date.now()?`Subscription active until <b>${d(info.paidUntil)}</b>. `:info.onTrial?`Free trial ends <b>${d(info.trialEndsAt)}</b>. `:`<b>Your access has expired.</b> `;
 h+=`<br><input id="em" type="email" placeholder="Billing email" style="margin:6px 0"><button class="p" onclick="pay('monthly')">₦15,000 / month</button> <button class="p" onclick="pay('yearly')">₦115,000 / year</button>`;
 $("bn").innerHTML=h}
async function pay(plan){const r=await fetch("/api/subscribe",{method:"POST",headers:{"x-session":tok},body:JSON.stringify({email:$("em").value,plan})});
 const d=await r.json();if(d.url)location=d.url;else alert(d.error||"Could not start payment")}
function render(){const q=$("q").value.toLowerCase(),L=$("list");L.innerHTML="";
 $("subs").innerHTML=[...new Set(menu.map(i=>i.subcategory))].map(s=>`<option value="${s.replace(/"/g,"")}">`).join("");
 $("subs").id="subs";document.body.appendChild($("subs"));
 menu.forEach((it,ix)=>{if(q&&!(it.title+it.subcategory).toLowerCase().includes(q))return;
  const c=document.createElement("div");c.className="c";
  c.innerHTML=`<div class="r r3"><input placeholder="Name"><input placeholder="Price ₦" type="number" min="0"></div>
  <div class="r"><select><option value="breakfast">Breakfast</option><option value="food">Food</option><option value="drinks">Drinks</option></select><input list="subs" placeholder="Section"></div>
  <textarea rows="2" placeholder="Description"></textarea><button class="d">Delete</button>`;
  const [n,p,s,sub,ta]=[...c.querySelectorAll("input,select,textarea")].slice(0,5);
  n.value=it.title;p.value=it.price;s.value=it.category;sub.value=it.subcategory;ta.value=it.description;
  n.oninput=()=>it.title=n.value;p.oninput=()=>it.price=+p.value||0;s.onchange=()=>it.category=s.value;sub.oninput=()=>it.subcategory=sub.value;ta.oninput=()=>it.description=ta.value;
  c.querySelector(".d").onclick=()=>{if(confirm("Delete "+(it.title||"this item")+"?")){menu.splice(ix,1);render()}};L.appendChild(c)})}
function add(){menu.unshift({id:"i"+Date.now(),title:"",price:0,category:"food",subcategory:"Starters",description:""});$("q").value="";render()}
async function save(){$("st").textContent="Saving...";
 const r=await fetch("/api/menu",{method:"PUT",headers:{"x-session":tok,"Content-Type":"application/json"},body:JSON.stringify(menu)});
 $("st").textContent=r.ok?"Saved. Guests now see the new menu.":r.status==402?"Access expired. Please subscribe above.":"Not saved. Try again."}
(function () {
            var intro = document.getElementById('pageIntro');
            var root = document.documentElement;
            root.classList.add('intro-lock');
            var done = false;
            function finish() {
                if (done) return;
                done = true;
                intro.classList.add('intro-exit');
                root.classList.remove('intro-lock');
                setTimeout(function () { intro.remove(); }, 1500);
            }
            intro.addEventListener('click', finish);
            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            setTimeout(finish, reduce ? 700 : 2500);
        })();
    </script>

    <!-- Auth Container -->
    <div id="login-container" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
        <div class="flex flex-col items-center justify-center mb-6">
            <div class="flex items-center space-x-1 text-3xl font-extrabold tracking-tight">
                <span class="text-[#00a8e8]">Blue</span>
                <span class="text-[#00348a] flex items-center">
                    <span class="relative inline-block">
                        a
                        <svg class="absolute -top-2.5 left-1/2 -translate-x-1/2 w-3.5 h-3.5 text-[#d4af37]" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17,8C15,8 10,5 12,1C12,1 15,3 17,8Z"/>
                        </svg>
                    </span>pple
                </span>
            </div>
            <span class="text-[10px] font-cinzel tracking-[0.25em] text-gray-500 uppercase mt-1">Admin Portal</span>
        </div>

        <h2 id="auth-title" class="text-xl font-bold mb-4 text-center text-gray-800 border-b pb-3">Sign In</h2>
        
        <div id="login-notification" class="hidden mb-4 p-3 rounded-lg text-sm font-medium text-center"></div>

        <!-- Login / Register Form -->
        <form id="admin-login-form" class="space-y-4">
            <div id="invite-code-group" class="hidden">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="invite-code">Invite Code</label>
                <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800" type="text" id="invite-code" placeholder="Enter admin invite code">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="username">Email Address</label>
                <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800" type="email" id="username" placeholder="admin@example.com" required>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
                <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800" type="password" id="password" required>
            </div>

            <div class="flex items-center justify-between text-xs pt-1">
                <button type="button" id="toggle-register-btn" class="text-blue-600 hover:underline font-semibold">Create Account</button>
                <button type="button" id="forgot-pw-btn" class="text-gray-500 hover:underline">Forgot Password?</button>
            </div>

            <button type="submit" id="submit-auth-btn" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition duration-200 shadow">Login</button>
        </form>

        <!-- Reset Password Form (Shown when clicking reset link) -->
        <form id="reset-password-form" class="hidden space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="new-password">New Password</label>
                <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800" type="password" id="new-password" placeholder="At least 8 characters" required>
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-2.5 rounded-lg font-semibold hover:bg-green-700 transition duration-200 shadow">Update Password</button>
        </form>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm border border-gray-200 space-y-4">
            <h3 class="text-lg font-bold text-gray-800 border-b pb-2">Reset Password</h3>
            <p class="text-xs text-gray-600">Enter your registered email address below. A confirmation reset link will be generated for your account access.</p>
            <div>
                <label class="block text-gray-700 text-xs font-bold mb-1" for="forgot-email">Registered Email</label>
                <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 text-sm" type="email" id="forgot-email" placeholder="admin@example.com" required>
            </div>
            <div id="forgot-link-box" class="hidden bg-gray-50 border p-2.5 rounded text-xs break-all text-blue-700 font-mono"></div>
            <div class="flex space-x-2 pt-2">
                <button type="button" id="send-forgot-btn" class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 text-xs">Send Reset Link</button>
                <button type="button" id="close-forgot-btn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-medium hover:bg-gray-300 text-xs">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="dashboard-container" class="hidden w-full max-w-4xl mx-auto p-6 bg-white rounded-xl shadow-lg border border-gray-200">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-1 text-2xl font-extrabold tracking-tight">
                    <span class="text-[#00a8e8]">Blue</span>
                    <span class="text-[#00348a] flex items-center">
                        <span class="relative inline-block">
                            a
                            <svg class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 text-[#d4af37]" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M17,8C15,8 10,5 12,1C12,1 15,3 17,8Z"/>
                            </svg>
                        </span>pple
                    </span>
                </div>
                <span class="text-gray-300">|</span>
                <h1 class="text-xl font-bold text-gray-800">Admin Dashboard</h1>
            </div>
            <button id="admin-logout-btn" class="bg-red-500 text-white px-4 py-2 rounded-lg font-medium hover:bg-red-600 transition duration-200">Logout</button>
        </div>
        <div class="text-gray-600">
            <p>Welcome to the admin management portal.</p>
        </div>
    </div>

    <script>
        const loginContainer = document.getElementById('login-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const loginForm = document.getElementById('admin-login-form');
        const resetForm = document.getElementById('reset-password-form');
        const notification = document.getElementById('login-notification');
        const logoutBtn = document.getElementById('admin-logout-btn');
        const toggleRegisterBtn = document.getElementById('toggle-register-btn');
        const inviteGroup = document.getElementById('invite-code-group');
        const authTitle = document.getElementById('auth-title');
        const submitAuthBtn = document.getElementById('submit-auth-btn');
        const forgotPwBtn = document.getElementById('forgot-pw-btn');
        const forgotModal = document.getElementById('forgot-modal');
        const sendForgotBtn = document.getElementById('send-forgot-btn');
        const closeForgotBtn = document.getElementById('close-forgot-btn');
        const forgotLinkBox = document.getElementById('forgot-link-box');

        let isRegisterMode = false;
        const urlParams = new URLSearchParams(window.location.search);
        const resetTokenParam = urlParams.get('reset_token');

        function showNotification(message, isSuccess = false) {
            notification.textContent = message;
            notification.className = `mb-4 p-3 rounded-lg text-sm font-medium text-center ${isSuccess ? 'bg-green-100 text-green-700 border border-green-300' : 'bg-red-100 text-red-700 border border-red-300'}`;
            notification.classList.remove('hidden');
        }

        if (resetTokenParam) {
            authTitle.textContent = "Reset Your Password";
            loginForm.classList.add('hidden');
            resetForm.classList.remove('hidden');
        } else if (localStorage.getItem('admin_token')) {
            loginContainer.classList.add('hidden');
            dashboardContainer.classList.remove('hidden');
        }

        toggleRegisterBtn.addEventListener('click', () => {
            isRegisterMode = !isRegisterMode;
            if (isRegisterMode) {
                authTitle.textContent = "Create Account";
                inviteGroup.classList.remove('hidden');
                submitAuthBtn.textContent = "Create Account";
                toggleRegisterBtn.textContent = "Back to Sign In";
            } else {
                authTitle.textContent = "Sign In";
                inviteGroup.classList.add('hidden');
                submitAuthBtn.textContent = "Login";
                toggleRegisterBtn.textContent = "Create Account";
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const code = document.getElementById('invite-code').value;

            const action = isRegisterMode ? 'register' : 'login';
            const payload = isRegisterMode ? { action, email, password, code } : { action, email, password };

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (response.ok && (data.ok || data.success)) {
                    showNotification(isRegisterMode ? 'Account created successfully! Redirecting...' : 'Login successful! Redirecting...', true);
                    localStorage.setItem('admin_token', data.token || 'active_session');
                    setTimeout(() => {
                        loginContainer.classList.add('hidden');
                        dashboardContainer.classList.remove('hidden');
                        notification.classList.add('hidden');
                    }, 800);
                } else {
                    showNotification(data.error || data.message || 'Authentication failed.');
                }
            } catch (err) {
                showNotification('An error occurred. Please check network connection.');
            }
        });

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'reset', token: resetTokenParam, newPassword })
                });
                const data = await response.json();
                if (response.ok && data.ok) {
                    showNotification('Password updated successfully! Please log in.', true);
                    setTimeout(() => {
                        window.location.href = '/admin.html';
                    }, 1500);
                } else {
                    showNotification(data.error || 'Failed to update password.');
                }
            } catch (err) {
                showNotification('Connection error during reset.');
            }
        });

        forgotPwBtn.addEventListener('click', () => {
            forgotModal.classList.remove('hidden');
        });

        closeForgotBtn.addEventListener('click', () => {
            forgotModal.classList.add('hidden');
            forgotLinkBox.classList.add('hidden');
        });

        sendForgotBtn.addEventListener('click', async () => {
            const email = document.getElementById('forgot-email').value;
            if (!email) return alert('Enter a valid email.');
            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'forgot', email })
                });
                const data = await response.json();
                if (response.ok && data.ok) {
                    if (data.resetLink) {
                        forgotLinkBox.innerHTML = `<strong>Reset Link (Click or Copy):</strong><br><a href="${data.resetLink}" class="underline hover:text-blue-900">${data.resetLink}</a>`;
                        forgotLinkBox.classList.remove('hidden');
                    } else {
                        alert(data.message || 'Reset link sent to registered email.');
                        forgotModal.classList.add('hidden');
                    }
                } else {
                    alert(data.error || 'Failed to process request.');
                }
            } catch (err) {
                alert('Connection error.');
            }
        });

        logoutBtn.addEventListener('click', async () => {
            const tok = localStorage.getItem('admin_token');
            if (tok) {
                await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-session': tok },
                    body: JSON.stringify({ action: 'logout' })
                }).catch(() => {});
            }
            localStorage.removeItem('admin_token');
            dashboardContainer.classList.add('hidden');
            loginContainer.classList.remove('hidden');
            loginForm.reset();
            showNotification('Logged out successfully.', true);
        });
</script>
</body>
</html>
